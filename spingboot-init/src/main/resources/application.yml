spring:
  application:
    name: spingboot-init
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss


server:
  port: ${SERVER_PORT:8888}
  servlet:
    context-path: /api

app:
  security:
    pepper: ${APP_SECURITY_PEPPER:}

moderation:
  comment-ban-hours: 1
  admin-ban-max-hours: 8760
  bad-words:
    - 傻逼
    - 傻B
    - 草泥马
    - 你妈
    - 去死
    - 废物
    - 人渣
    - 贱人
    - 滚蛋
    - 神经病
    - 白痴
    - 弱智
    - 操你
    - fuck
    - shit
    - bitch
    - 垃圾话
    - 色情
    - sb
    - 赌博

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.spingbootinit.controller

judge:
  mq:
    mode: ${JUDGE_MQ_MODE:async}
    stream-key: judge:stream
    group: judge-group
    consumer: ${JUDGE_STREAM_CONSUMER:judge-consumer-1}
    rabbit:
      exchange: judge.exchange
      queue: judge.queue
      routing-key: judge.submit

test:
  pay: AliPay
