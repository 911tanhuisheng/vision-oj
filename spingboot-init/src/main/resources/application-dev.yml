spring:
  config:
    # IDEA may run from the repository root; Maven usually runs from this module.
    # Both locations point to the same ignored private file in their respective workdir.
    import:
      - optional:file:./spingboot-init/application-local.yml
      - optional:file:./application-local.yml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/test?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # Local development connects to server Redis through the FinalShell SSH tunnel.
      # Keep FinalShell running: 127.0.0.1:16379 -> server 127.0.0.1:6379.
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      timeout: 10s
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:}
    virtual-host: /
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  # 本机通过环境变量或模块根目录的私有配置提供 JWT_SECRET。
  secret: ${JWT_SECRET}
  expiration: 86400
  access-expiration: 86400
  refresh-expiration: 604800

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:mayue-oj}
  public-url: ${MINIO_PUBLIC_URL:}

vision-ai:
  enabled: ${VISION_AI_ENABLED:true}
  base-url: ${VISION_AI_BASE_URL:http://127.0.0.1:8090}

image-generation:
  enabled: ${IMAGE_GENERATION_ENABLED:true}
  base-url: ${COMFYUI_BASE_URL:http://127.0.0.1:8188}
  checkpoint: ${COMFYUI_CHECKPOINT:v1-5-pruned-emaonly.safetensors}
  allowed-checkpoints: ${COMFYUI_ALLOWED_CHECKPOINTS:v1-5-pruned-emaonly.safetensors}
  cloud-base-url: ${DASHSCOPE_IMAGE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  timeout-seconds: ${COMFYUI_TIMEOUT_SECONDS:180}

codesandbox:
  type: ${CODESANDBOX_TYPE:remote}
  url: ${SANDBOX_URL:http://127.0.0.1:8080/api/sandbox}
  auth-header-name: ${SANDBOX_AUTH_HEADER:auth}
  auth-key: ${SANDBOX_AUTH_KEY}

ai:
  personal-key-encryption-key: ${AI_CREDENTIAL_ENCRYPTION_KEY:}

bailian:
  enabled: ${BAILIAN_ENABLED:false}
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model: ${DASHSCOPE_MODEL:qwen-plus}
  temperature: 0.35
  max-tokens: 2500
